name: Scrape GLP-1 prices

# Apagado. Este repo ya sólo sirve los 301 a medcompara.com.mx (ver
# vercel.json): nadie consume data/prices.json desde que la comparativa vive en
# el repo Labcompara, que tiene su propio scan (scripts/scan-farmacias.js) con
# las mismas seis fuentes y además Foundayz. El cron seguía corriendo cada tres
# días y commiteando precios que ninguna página lee.
#
# Se deja el workflow_dispatch por si hiciera falta una corrida puntual, pero el
# workflow está deshabilitado en Actions: reactivarlo requiere `gh workflow
# enable scrape-prices.yml`.
on:
  workflow_dispatch:
    inputs:
      recon:
        description: "Recon mode: diagnose Guadalajara/San Pablo (no commit)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r scraper/requirements.txt
      - name: Run scraper
        run: python scraper/scrape.py
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_PROVIDER: zyte
          SCRAPER_RECON: ${{ inputs.recon && '1' || '' }}
      - name: Commit refreshed prices
        run: |
          git config user.name  "glpcompara-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json data/prices_raw.json data/price-history.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "chore(data): refresh scraped GLP-1 prices [skip ci]"
            git push
          fi
