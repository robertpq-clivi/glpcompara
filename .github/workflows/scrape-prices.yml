name: Scrape GLP-1 prices

on:
  schedule:
    - cron: "0 13 */3 * *"   # every 3 days ~07:00 America/Mexico_City (days 1,4,7,…)
  workflow_dispatch: {}      # allow manual runs

permissions:
  contents: write

concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r scraper/requirements.txt
      - name: Run scraper
        run: python scraper/scrape.py
      - name: Commit refreshed prices
        run: |
          git config user.name  "glpcompara-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json data/prices_raw.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "chore(data): refresh scraped GLP-1 prices [skip ci]"
            git push
          fi
